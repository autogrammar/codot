services:
  # Bundle validation and execution service
  godot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godot-bundle-service
    volumes:
      - ./bundles:/app/bundles
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./generated:/app/generated
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - BUNDLE_SCHEMA_URI=http://schema-server:80/bundle.schema.json
      - TEMPORAL_HOST=temporal:7233
      - LOG_LEVEL=info
    ports:
      - "${GODOT_PORT_8080:-8080}:8080"
      - "${GODOT_PORT_8081:-8081}:8081"
      - "${GODOT_PORT_8082:-8082}:8082"
      - "${GODOT_PORT_8083:-8083}:8083"
    networks:
      - bundle-network
    command: tail -f /dev/null

  # Temporal server for workflow orchestration
  temporal:
    image: temporalio/auto-setup:latest@sha256:42ca35d05d9b6f3d84dc844af94cd4bda4adb23bee0cc1b4ddcafc0eea4f6afb
    container_name: temporal-server
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgres
    networks:
      - bundle-network
    depends_on:
      - postgres

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:latest@sha256:07937b24259e644e5e114c2b39490324f2297c80ce4960c0ddeda1d9f236e926
    container_name: temporal-ui
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - bundle-network
    depends_on:
      - temporal

  # PostgreSQL for Temporal
  postgres:
    image: postgres:13-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: temporal-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_DB=${POSTGRES_DB:-temporal}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - bundle-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-audit.sql:/docker-entrypoint-initdb.d/99-init-audit.sql:ro

  # Schema server + Auth proxy (Caddy)
  schema-server:
    image: caddy:latest@sha256:4ca8684fcc0eceb21b85b6546ba8a1ffa656a3033391bf8126d64e387b38f9fa
    container_name: schema-server
    volumes:
      - ./bundle.schema.json:/srv/bundle.schema.json
      - ./caddy.conf:/etc/caddy/Caddyfile
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${SCHEMA_SERVER_PORT:-8084}:80"
    networks:
      - bundle-network

  # Jaeger — OTel trace collector & UI
  jaeger:
    image: jaegertracing/all-in-one:latest@sha256:62651dca8917ca1e7dc8f8b6cbc74cf7465c224b44dd2e45eb0e9c67e05526b1
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - bundle-network

  # LiteLLM bundle generation + ACL service
  llm:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: godot-llm
    env_file:
      - ./llm/.env
    environment:
      - LLM_ACL_FILE=/app/acl.yaml
      - LLM_OFFLINE=true
      - BUNDLE_OUTPUT_DIR=/app/bundles/generated
      - BUNDLE_SCHEMA_FILE=/app/bundle.schema.json
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_DB=${POSTGRES_DB:-temporal}
    volumes:
      - ./llm:/app
      - ./bundles:/app/bundles
      - ./sample-data:/app/sample-data:ro
      - ./schemas:/app/schemas:ro
      - ./bundle.schema.json:/app/bundle.schema.json:ro
    ports:
      - "${LLM_PORT:-18094}:8000"
    networks:
      - bundle-network
    depends_on:
      - schema-server
      - mock-api

  # Mock API used for service and NLP tests
  mock-api:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: godot-mock-api
    env_file:
      - ./llm/.env
    volumes:
      - ./llm:/app
      - ./bundle.schema.json:/app/bundle.schema.json:ro
    command: uvicorn app:mock_app --host 0.0.0.0 --port 8001
    ports:
      - "${MOCK_API_PORT:-18095}:8001"
    networks:
      - bundle-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: bundle-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bundle-network
    depends_on:
      - llm

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    container_name: bundle-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - bundle-network
    depends_on:
      - prometheus

  # MinIO — S3-compatible artifact storage for generated apps
  minio:
    image: minio/minio:latest@sha256:f19713e2a8a3a4bc2b946383672313b837128689d6de3c2b9cf6aad9c8cabef4
    container_name: bundle-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    networks:
      - bundle-network

networks:
  bundle-network:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  minio-data:
